pipeline:
  name: third-party-git
  identifier: thirdpartygit
  projectIdentifier: default_project
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: shajal2
        repoName: practice02
        build: <+input>
        sparseCheckout: []
  stages:
    - stage:
        name: build
        identifier: build
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: shell-command
                  identifier: Run_1
                  spec:
                    connectorRef: dockerconnector
                    image: alpine/git:v2.49.0
                    shell: Sh
                    command: |-
                      git fetch --all
                      git branch -r
